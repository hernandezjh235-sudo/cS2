# Final validation uses public HLTV team-page map cards plus direct match grading.
name: CS2 Pipeline Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cs2-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cs2-pipeline-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore cache
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
        run: |
          mkdir -p /tmp/cs2_engine
          python github_cache_sync_v582.py pull --data-dir /tmp/cs2_engine --repo "${GITHUB_REPOSITORY}" --branch data-cache || true
      - name: Run collector and summarize final strict gates
        continue-on-error: true
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
          CS2_ASSISTED_OFFICIAL: "false"
          CS2_AUTO_HARVEST_HISTORY: "true"
          CS2_COLLECT_PROJECTIONS: "true"
          CS2_AUTO_GRADE: "true"
          CS2_DEEP_DATA: "true"
          CS2_WEB_ALLOW_PROVIDER_NETWORK: "true"
          CS2_AUTOFEED_DIRECT_PROFILE_BATCH: "120"
          CS2_PROFILE_RECOVERY_PASSES: "3"
          CS2_HLTV_DIRECT_PROFILE_PAGES: "5"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python collector_v55.py || true
          python - <<'PY'
          import csv,json
          from pathlib import Path
          root=Path('/tmp/cs2_engine')
          names=['.autofeed_collector_status.json','cs2_context_health.json','cs2_data_readiness.json','cs2_operational_status.json','cs2_grading_health.json','cs2_provider_discovery_health.json','cs2_hltv_direct_health.json','cs2_hltv_profile_health.json','cs2_hltv_map_health.json','cs2_direct_grading_health.json','cs2_live_line_catalog.json','cs2_provider_cache.json','cs2_official_snapshots.json','cs2_graded_results.json']
          summary={}
          for name in names:
              p=root/name
              if not p.exists(): summary[name]={'missing':True}; continue
              try:
                  obj=json.loads(p.read_text())
                  if name=='cs2_live_line_catalog.json' and isinstance(obj,dict): obj={k:v for k,v in obj.items() if k!='rows'}
                  if name=='cs2_provider_cache.json' and isinstance(obj,dict): obj={'schema_version':obj.get('schema_version'),'generated_at':obj.get('generated_at'),'profiles':len(obj.get('profiles') or {}),'teams':len(obj.get('teams') or {}),'matches':len(obj.get('matches') or []),'source_status':obj.get('source_status')}
                  if isinstance(obj,list): obj={'rows':len(obj)}
                  summary[name]=obj
              except Exception as e: summary[name]={'error':str(e),'bytes':p.stat().st_size}
          board=root/'current_board.csv'
          if board.exists():
              rows=list(csv.DictReader(board.open()))
              yes=lambda v:str(v).lower() in {'1','true','yes'}
              def num(v):
                  try:return int(float(v or 0))
                  except:return 0
              summary['current_board.csv']={'rows':len(rows),'supported':sum(yes(r.get('model_supported')) and yes(r.get('market_scope_verified')) for r in rows),'projection_ready':sum(yes(r.get('projection_data_ready')) for r in rows),'official_ready':sum(yes(r.get('official_data_ready')) for r in rows),'provider_context':sum(yes(r.get('v587_provider_context')) for r in rows),'provider_urls':sum(str(r.get('provider_match_url') or '').startswith('https://www.hltv.org/') for r in rows),'deep_rows':sum(num(r.get('team_recent_maps'))>0 and num(r.get('opponent_mapstats_samples'))>0 for r in rows),'core_kpr':sum(yes(r.get('core_kpr_verified')) for r in rows),'fresh_players':sum(yes(r.get('player_source_fresh')) for r in rows)}
          (root/'v594_diagnostic_summary.json').write_text(json.dumps(summary,indent=2,default=str))
          print(json.dumps(summary,indent=2,default=str))
          PY
      - name: Verify direct Maps 1-2 grader on completed HLTV match
        continue-on-error: true
        env:
          CS2_DATA_DIR: /tmp/cs2_grade_fixture
          CS2_WEB_ALLOW_PROVIDER_NETWORK: "true"
          CS2_ASSISTED_OFFICIAL: "false"
        run: |
          mkdir -p /tmp/cs2_grade_fixture
          python - <<'PY'
          import json
          import collector_v55
          import collector as base
          ns=base.load_engine()
          url='https://www.hltv.org/matches/2394983/vitality-vs-mouz-iem-cologne-major-2026'
          actual,meta=ns['fetch_actual_maps12_kills'](url,'ZywOo','')
          out={'actual_maps12_kills':actual,'meta':meta,'ok':actual is not None and bool(meta.get('ok')) and len(meta.get('map_results') or [])==2 and len(meta.get('map_links') or [])==2}
          from pathlib import Path
          Path('/tmp/cs2_grade_fixture/v594_grade_fixture.json').write_text(json.dumps(out,indent=2,default=str))
          print(json.dumps(out,indent=2,default=str))
          if not out['ok']: raise SystemExit('direct HLTV Maps 1-2 grading fixture did not verify')
          PY
      - name: Upload v5.9.4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cs2-v594-diagnostics
          path: |
            /tmp/cs2_engine/v594_diagnostic_summary.json
            /tmp/cs2_engine/.autofeed_collector_status.json
            /tmp/cs2_engine/cs2_context_health.json
            /tmp/cs2_engine/cs2_data_readiness.json
            /tmp/cs2_engine/cs2_operational_status.json
            /tmp/cs2_engine/cs2_grading_health.json
            /tmp/cs2_engine/cs2_provider_discovery_health.json
            /tmp/cs2_engine/cs2_hltv_direct_health.json
            /tmp/cs2_engine/cs2_hltv_profile_health.json
            /tmp/cs2_engine/cs2_hltv_map_health.json
            /tmp/cs2_engine/cs2_direct_grading_health.json
            /tmp/cs2_engine/current_board.csv
            /tmp/cs2_grade_fixture/v594_grade_fixture.json
          if-no-files-found: warn
          retention-days: 3