name: CS2 Provider Probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cs2-provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Inspect public HLTV team map cards
        run: |
          mkdir -p /tmp/provider_probe
          python - <<'PY'
          import json,requests,pathlib,re,html
          root=pathlib.Path('/tmp/provider_probe')
          s=requests.Session(); s.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/137 Safari/537.36','Accept-Language':'en-US,en;q=0.9'})
          url='https://www.hltv.org/team/7020/spirit'
          r=s.get(url,timeout=30); t=r.text or ''
          rows=[]
          for m in re.finditer(r'class=["\']map-statistics-row(?:\s[^"\']*)?["\']',t,re.I):
              chunk=t[m.start():m.start()+9000]
              nextm=re.search(r'class=["\']map-statistics-row(?:\s[^"\']*)?["\']',chunk[80:],re.I)
              if nextm: chunk=chunk[:80+nextm.start()]
              txt=html.unescape(re.sub(r'<[^>]+>',' ',chunk)); txt=re.sub(r'\s+',' ',txt).strip()
              rows.append({'text':txt[:2500],'html':re.sub(r'\s+',' ',chunk)[:5000]})
          out={'status':r.status_code,'bytes':len(t.encode()),'rows_found':len(rows),'rows':rows[:12]}
          (root/'team_map_rows.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:35000])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cs2-team-map-row-probe
          path: /tmp/provider_probe/team_map_rows.json
          retention-days: 2