name: CS2 Source Extract

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cs2-source-extract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract grading and snapshot implementation
        run: |
          python - <<'PY'
          from pathlib import Path
          src=Path('app.py').read_text(encoding='utf-8',errors='ignore').splitlines()
          out=[]
          for start,end,label in [(4515,4580,'snapshots'),(4600,4735,'automatic-hltv-grade'),(12480,12625,'v55-grade-wrapper')]:
              out.append(f'===== {label} app.py {start}-{end} =====')
              out.extend(f'{i}: {src[i-1]}' for i in range(start,min(end,len(src))+1))
          Path('/tmp/grading_source_extract.txt').write_text('\n'.join(out),encoding='utf-8')
          print('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cs2-grading-source-extract
          path: /tmp/grading_source_extract.txt
          retention-days: 2