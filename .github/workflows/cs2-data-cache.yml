name: CS2 Data Cache

on:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "github_cache_sync.py"
      - "autofeed_*.py"
      - "prepare_web_app.py"
      - ".github/workflows/cs2-data-cache.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-data-cache
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore prior public cache
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
        run: |
          mkdir -p /tmp/cs2_engine
          python github_cache_sync.py pull --data-dir /tmp/cs2_engine --repo "${GITHUB_REPOSITORY}" --branch data-cache || true

      - name: Collect verified CS2 data
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
          CS2_ASSISTED_OFFICIAL: "false"
          CS2_AUTO_HARVEST_HISTORY: "true"
          CS2_COLLECT_PROJECTIONS: "true"
          CS2_AUTO_GRADE: "true"
          CS2_DEEP_DATA: "true"
          CS2_BO3_PROFILES_PER_REFRESH: "180"
          CS2_AUTOFEED_DIRECT_PROFILE_BATCH: "60"
          CS2_AUTOFEED_DIRECT_WORKERS: "4"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python collector.py
          cat /tmp/cs2_engine/.autofeed_collector_status.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/cs2_engine/.autofeed_collector_status.json')
          if not p.exists():
              raise SystemExit('collector status file missing')
          s = json.loads(p.read_text())
          if not s.get('ok'):
              raise SystemExit(f"collector failed: {s.get('error') or s}")
          if int(s.get('underdog_rows') or 0) <= 0:
              raise SystemExit('collector returned no real Underdog rows')
          print('collector validation:', {
              'underdog_rows': s.get('underdog_rows'),
              'verified_profile_rows': s.get('verified_profile_rows'),
              'projection_rows_saved': s.get('projection_rows_saved'),
              'github_bridge_profiles_after': s.get('github_bridge_profiles_after'),
              'github_bridge_teams_after': s.get('github_bridge_teams_after'),
              'github_bridge_matches_after': s.get('github_bridge_matches_after'),
          })
          PY

      - name: Build portable data cache
        run: |
          rm -rf /tmp/cs2_cache_publish
          python github_cache_sync.py package --data-dir /tmp/cs2_engine --output-dir /tmp/cs2_cache_publish
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('/tmp/cs2_cache_publish/cs2_data_manifest.json')
          m = json.loads(p.read_text())
          files = m.get('files') or []
          if not files:
              raise SystemExit('refusing to publish an empty CS2 data cache')
          required_any = {'cs2_line_history.json', 'cs2_core_v42.sqlite3', 'cs2_provider_cache.json', 'player_database.json'}
          names = {x.get('name') for x in files}
          if not (names & required_any):
              raise SystemExit(f'cache missing core data files: {sorted(names)}')
          print('cache validation:', {'files': len(files), 'archive_size': m.get('archive_size'), 'names': sorted(names)})
          PY
          ls -lh /tmp/cs2_cache_publish

      - name: Publish single-snapshot data-cache branch
        shell: bash
        run: |
          git config user.name "onewaypickz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/cs2-data-cache-worktree
          git worktree add --detach /tmp/cs2-data-cache-worktree HEAD
          cd /tmp/cs2-data-cache-worktree
          git checkout --orphan data-cache-publish
          git rm -rf . || true
          cp -a /tmp/cs2_cache_publish/. .
          git add -A
          git commit -m "Refresh CS2 data cache $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:data-cache --force
