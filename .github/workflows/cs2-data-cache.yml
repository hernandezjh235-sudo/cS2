name: CS2 Data Cache

on:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "collector_v55.py"
      - "github_cache_sync*.py"
      - "autofeed_*.py"
      - "prepare_web_app.py"
      - "start.sh"
      - "railway*.toml"
      - ".github/workflows/cs2-data-cache.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-data-cache
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Compile production runtime v5.9.3
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
        run: |
          mkdir -p /tmp/cs2_engine
          RUNTIME="$(python prepare_web_app.py | tail -n 1)"
          python -m py_compile "$RUNTIME" collector_v55.py github_cache_sync_v582.py autofeed_provider_v590.py autofeed_hltv_v591.py autofeed_profiles_v592.py autofeed_maps_v593.py
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/cs2_engine/.web_runtime_status.json').read_text())
          if not s.get('ok') or s.get('runtime_version')!='5.9.3': raise SystemExit(f'production runtime not v5.9.3: {s}')
          patches={x.get('file'):x for x in s.get('patches') or []}
          required=['autofeed_verified_v586.py','autofeed_completion_v587.py','autofeed_completion_v588.py','autofeed_handoff_v589.py','autofeed_provider_v590.py','autofeed_hltv_v591.py','autofeed_profiles_v592.py','autofeed_maps_v593.py']
          missing=[x for x in required if not patches.get(x,{}).get('ok')]
          if missing: raise SystemExit(f'missing production patches: {missing}')
          print('runtime ok',s['runtime_version'])
          PY

      - name: Restore prior durable cache
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
        run: |
          python github_cache_sync_v582.py pull --data-dir /tmp/cs2_engine --repo "${GITHUB_REPOSITORY}" --branch data-cache || true
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cs2_engine')
          def load(n,d):
              try:return json.loads((root/n).read_text())
              except:return d
          p=load('cs2_provider_cache.json',{})
          before={'profiles':len(p.get('profiles') or {}) if isinstance(p,dict) else 0,'results':len(load('cs2_graded_results.json',[])),'snapshots':len(load('cs2_official_snapshots.json',[])),'line_history':len(load('cs2_line_history.json',[]))}
          (root/'.before_v593.json').write_text(json.dumps(before)); print(before)
          PY

      - name: Collect and validate real CS2 production data
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
          CS2_ASSISTED_OFFICIAL: "false"
          CS2_AUTO_HARVEST_HISTORY: "true"
          CS2_COLLECT_PROJECTIONS: "true"
          CS2_AUTO_GRADE: "true"
          CS2_DEEP_DATA: "true"
          CS2_WEB_ALLOW_PROVIDER_NETWORK: "true"
          CS2_AUTOFEED_DIRECT_PROFILE_BATCH: "120"
          CS2_PROFILE_RECOVERY_PASSES: "3"
          CS2_HLTV_DIRECT_PROFILE_PAGES: "5"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          python collector_v55.py
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cs2_engine')
          def load(n,d):
              try:return json.loads((root/n).read_text())
              except:return d
          status=load('.autofeed_collector_status.json',{})
          if not status.get('ok'): raise SystemExit(f'collector failed: {status}')
          if int(status.get('underdog_rows') or 0)<=0: raise SystemExit('no real Underdog CS2 Maps 1-2 rows')
          before=load('.before_v593.json',{})
          provider=load('cs2_provider_cache.json',{}); src=(provider.get('source_status') or {}) if isinstance(provider,dict) else {}
          context=load('cs2_context_health.json',{}); readiness=load('cs2_data_readiness.json',{}); grading=load('cs2_grading_health.json',{}); live=load('cs2_live_line_catalog.json',{})
          after={'profiles':len(provider.get('profiles') or {}) if isinstance(provider,dict) else 0,'results':len(load('cs2_graded_results.json',[])),'snapshots':len(load('cs2_official_snapshots.json',[])),'line_history':len(load('cs2_line_history.json',[]))}
          for k in before:
              if after.get(k,0)<before.get(k,0): raise SystemExit(f'durable data regression {k}: {before.get(k)} -> {after.get(k)}')
          metrics={
              'exact_source_identity_rows':int(src.get('exact_source_identity_rows') or context.get('exact_source_identity_rows') or 0),
              'blank_source_team_rows':int(src.get('supported_exact_id_blank_team_rows') or context.get('supported_exact_id_blank_team_rows') or 0),
              'verified_profile_rows':int(src.get('verified_profile_rows') or context.get('verified_profile_rows') or 0),
              'core_kpr_rows':int(src.get('core_kpr_rows') or context.get('core_kpr_rows') or 0),
              'provider_rows':int(src.get('real_provider_match_rows') or context.get('real_provider_match_rows') or 0),
              'provider_context_rows':int(src.get('provider_context_rows') or 0),
              'deep_team_map_rows':int(src.get('deep_team_map_rows') or context.get('deep_team_map_rows') or 0),
              'projection_ready_rows':int(src.get('projection_ready_rows') or context.get('projection_ready_rows') or 0),
              'non_cs2_rows_visible':int(src.get('non_cs2_rows_visible') or context.get('non_cs2_rows_visible') or 0),
              'freeze_candidate_rows':int(src.get('freeze_candidate_rows') or context.get('freeze_candidate_rows') or 0),
          }
          required_positive=['exact_source_identity_rows','verified_profile_rows','core_kpr_rows','provider_rows','provider_context_rows','deep_team_map_rows','projection_ready_rows']
          bad=[k for k in required_positive if metrics[k]<=0]
          if bad: raise SystemExit(f'strict production gates failed {bad}: {metrics}')
          if metrics['blank_source_team_rows']!=0: raise SystemExit(f'authoritative team identity blank: {metrics}')
          if metrics['non_cs2_rows_visible']!=0: raise SystemExit(f'non-CS2 rows leaked: {metrics}')
          if int(grading.get('errors') or 0)>0: raise SystemExit(f'autograding errors: {grading}')
          freeze=status.get('auto_freeze') or {}
          if metrics['freeze_candidate_rows']>0 and int(freeze.get('added') or 0)+int(freeze.get('skipped') or 0)<=0: raise SystemExit(f'freeze handoff failed: {freeze}')
          if not isinstance(live,dict) or int(live.get('model_supported_lines') or 0)<=0: raise SystemExit(f'live CS2 catalog missing: {live}')
          if after['profiles']<=0 or after['snapshots']<=0: raise SystemExit(f'durable provider/freeze cache empty: {after}')
          print(json.dumps({'runtime':'5.9.3','metrics':metrics,'before':before,'after':after,'grading':grading,'freeze':freeze},indent=2))
          PY

      - name: Package verified cache
        run: |
          rm -rf /tmp/cs2_cache_publish
          python github_cache_sync_v582.py package --data-dir /tmp/cs2_engine --output-dir /tmp/cs2_cache_publish
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cs2_cache_publish'); m=json.loads((root/'cs2_data_manifest.json').read_text()); names={x.get('name') for x in m.get('files') or []}
          required={'cs2_provider_cache.json','player_database.json','team_database.json','match_database.json','map_database.json','roster_database.json','veto_database.json','cs2_line_history.json','cs2_core_v42.sqlite3','cs2_data_readiness.json','cs2_grading_health.json','cs2_operational_status.json','cs2_context_health.json','cs2_live_line_catalog.json','cs2_official_snapshots.json'}
          missing=required-names
          if missing: raise SystemExit(f'incomplete cache: {sorted(missing)}')
          print('cache files',len(names))
          PY

      - name: Publish single-snapshot data-cache branch
        shell: bash
        run: |
          git config user.name "onewaypickz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/cs2-data-cache-worktree
          git worktree add --detach /tmp/cs2-data-cache-worktree HEAD
          cd /tmp/cs2-data-cache-worktree
          git checkout --orphan data-cache-publish
          git rm -rf . || true
          cp -a /tmp/cs2_cache_publish/. .
          git add -A
          git commit -m "Refresh CS2 v5.9.3 verified live data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:data-cache --force