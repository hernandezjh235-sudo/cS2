name: CS2 Data Cache

on:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "collector_v55.py"
      - "github_cache_sync*.py"
      - "autofeed_*.py"
      - "prepare_web_app.py"
      - "start.sh"
      - "railway*.toml"
      - ".github/workflows/cs2-data-cache.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-data-cache
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile v5.8.9 production runtime
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
        run: |
          mkdir -p /tmp/cs2_engine
          RUNTIME="$(python prepare_web_app.py | tail -n 1)"
          python -m py_compile "$RUNTIME" collector_v55.py github_cache_sync_v582.py autofeed_completion_v588.py autofeed_handoff_v589.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cs2_engine/.web_runtime_status.json')
          if not p.exists(): raise SystemExit('web runtime status missing')
          s=json.loads(p.read_text())
          if not s.get('ok') or s.get('runtime_version')!='5.8.9':
              raise SystemExit(f'v5.8.9 runtime not ready: {s}')
          patches={x.get('file'):x for x in s.get('patches') or []}
          required=[
              'autofeed_context_v57.py','autofeed_liveboard_v58.py','autofeed_webfast_v581.py',
              'autofeed_liveboard_v582.py','autofeed_liveboard_v583.py','autofeed_liveboard_v584.py',
              'autofeed_premodel_v585.py','autofeed_verified_v586.py','autofeed_completion_v587.py',
              'autofeed_completion_v588.py','autofeed_handoff_v589.py'
          ]
          missing=[x for x in required if not patches.get(x,{}).get('ok')]
          if missing: raise SystemExit(f'required runtime patches missing: {missing}')
          if s.get('completion_layer')!='5.8.9': raise SystemExit(f'completion layer missing: {s}')
          print('runtime validation:',s)
          PY

      - name: Restore prior verified cache
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
        run: |
          python github_cache_sync_v582.py pull --data-dir /tmp/cs2_engine --repo "${GITHUB_REPOSITORY}" --branch data-cache || true
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cs2_engine')
          def load(name, default):
              try: return json.loads((root/name).read_text())
              except Exception: return default
          provider=load('cs2_provider_cache.json',{})
          before={
              'profiles':len(provider.get('profiles') or {}) if isinstance(provider,dict) else 0,
              'teams':len(provider.get('teams') or {}) if isinstance(provider,dict) else 0,
              'matches':len(provider.get('matches') or []) if isinstance(provider,dict) else 0,
              'graded':len(load('cs2_graded_results.json',[])),
              'snapshots':len(load('cs2_official_snapshots.json',[])),
              'line_history':len(load('cs2_line_history.json',[])),
          }
          (root/'.v589_before.json').write_text(json.dumps(before))
          print('prior cache:',before)
          PY

      - name: Collect complete verified CS2 data
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
          CS2_ASSISTED_OFFICIAL: "false"
          CS2_AUTO_HARVEST_HISTORY: "true"
          CS2_COLLECT_PROJECTIONS: "true"
          CS2_AUTO_GRADE: "true"
          CS2_DEEP_DATA: "true"
          CS2_WEB_ALLOW_PROVIDER_NETWORK: "true"
          CS2_BO3_PROFILES_PER_REFRESH: "180"
          CS2_AUTOFEED_DIRECT_PROFILE_BATCH: "120"
          CS2_PROFILE_RECOVERY_PASSES: "3"
          CS2_AUTOFEED_DIRECT_WORKERS: "4"
          CS2_HLTV_BATCH_PAGES: "12"
          CS2_HLTV_BATCH_WORKERS: "4"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          set +e
          python collector_v55.py
          COLLECT_RC=$?
          set -e
          export COLLECT_RC
          cat /tmp/cs2_engine/.autofeed_collector_status.json || true
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/cs2_engine')
          def load(name, default):
              try: return json.loads((root/name).read_text())
              except Exception: return default
          status_path=root/'.autofeed_collector_status.json'
          if not status_path.exists(): raise SystemExit(f'collector status missing; rc={os.getenv("COLLECT_RC")}')
          s=json.loads(status_path.read_text())
          if not s.get('ok'): raise SystemExit(f"collector failed: {s.get('error') or s}")
          if int(s.get('underdog_rows') or 0)<=0: raise SystemExit('no real Underdog CS2 Maps 1-2 rows')

          before=json.loads((root/'.v589_before.json').read_text())
          provider=load('cs2_provider_cache.json',{})
          src=(provider.get('source_status') or {}) if isinstance(provider,dict) else {}
          after={
              'profiles':len(provider.get('profiles') or {}) if isinstance(provider,dict) else 0,
              'teams':len(provider.get('teams') or {}) if isinstance(provider,dict) else 0,
              'matches':len(provider.get('matches') or []) if isinstance(provider,dict) else 0,
              'exact_source_identity_rows':int(src.get('exact_source_identity_rows') or 0),
              'provider_context_rows':int(src.get('provider_context_rows') or 0),
              'provider_match_rows':int(src.get('real_provider_match_rows') or 0),
              'deep_team_map_rows':int(src.get('deep_team_map_rows') or 0),
              'projection_ready_rows':int(src.get('projection_ready_rows') or 0),
              'official_ready_rows':int(src.get('official_ready_rows') or 0),
              'freeze_candidate_rows':int(src.get('freeze_candidate_rows') or 0),
              'blank_source_team_rows':int(src.get('supported_exact_id_blank_team_rows') or 0),
              'graded':len(load('cs2_graded_results.json',[])),
              'snapshots':len(load('cs2_official_snapshots.json',[])),
              'line_history':len(load('cs2_line_history.json',[])),
          }
          for key in ['profiles','graded','snapshots','line_history']:
              if after[key] < before[key]: raise SystemExit(f'regression blocked: {key} {before[key]} -> {after[key]}')
          if after['profiles']>0 and after['teams']<=0:
              raise SystemExit(f'identity persistence failed: {after}')

          context=load('cs2_context_health.json',{})
          readiness=load('cs2_data_readiness.json',{})
          live=load('cs2_live_line_catalog.json',{})
          grading=load('cs2_grading_health.json',{})
          if context.get('version')!='5.8.9' or context.get('runtime_layer')!='5.8.9':
              raise SystemExit(f'v5.8.9 context report missing: {context}')
          if readiness.get('version')!='5.8.9' or int(readiness.get('board_rows') or 0)<=0:
              raise SystemExit(f'v5.8.9 readiness report missing: {readiness}')
          if int(context.get('non_cs2_rows_visible') or 0)!=0:
              raise SystemExit(f'non-CS2 rows leaked: {context}')
          if live.get('version')!='5.8.6' or int(live.get('model_supported_lines') or 0)<=0:
              raise SystemExit(f'strict CS2 live catalog missing: {live}')

          board_status=s.get('board_status') or {}
          identity=board_status.get('v588_completion') or {}
          handoff=board_status.get('v589_verified_handoff') or {}
          ud=((s.get('underdog_status') or {}).get('v588_authoritative_source_identity') or {})
          if not identity: raise SystemExit(f'v5.8.8 identity completion report missing: {board_status}')
          if not handoff: raise SystemExit(f'v5.8.9 freeze/grading handoff missing: {board_status}')
          if int(ud.get('supported_exact_id_blank_team_rows') or 0)!=0:
              raise SystemExit(f'primary-source team names still blank after exact IDs: {ud}')
          if int(identity.get('exact_source_identity_rows') or 0)<=0:
              raise SystemExit(f'no authoritative current source identities reached board: {identity}')
          if int(identity.get('verified_profile_rows') or 0)<=0:
              raise SystemExit(f'no verified player profiles reached board: {identity}')
          if int(identity.get('core_kpr_rows') or 0)<=0:
              raise SystemExit(f'no verified Core KPR reached board: {identity}')
          if int(identity.get('real_provider_match_rows') or 0)<=0:
              raise SystemExit(f'provider match recovery still blocked: {identity}')
          if int(identity.get('deep_team_map_rows') or 0)<=0:
              raise SystemExit(f'provider match recovered but deep team/opponent map context is still empty: {identity}')
          if int(handoff.get('projection_ready_rows') or 0)<=0:
              raise SystemExit(f'zero verified projections after completed handoff: {handoff}')

          freeze=s.get('auto_freeze') or {}
          if int(handoff.get('freeze_candidate_rows') or 0)>0:
              if int(freeze.get('eligible') or 0)<=0 and int(freeze.get('freeze_candidates') or 0)<=0:
                  raise SystemExit(f'freeze candidates exist but pregame freeze handoff did not see them: {freeze}')
              if int(freeze.get('added') or 0)+int(freeze.get('skipped') or 0)<=0:
                  raise SystemExit(f'freeze candidates exist but no snapshot was added or already present: {freeze}')
          if int(grading.get('errors') or 0)>0:
              raise SystemExit(f'automatic grading health reports errors: {grading}')

          print('v5.8.9 verified data:', {
              'before':before,'after':after,'context':context,'readiness':readiness,
              'identity':identity,'handoff':handoff,'freeze':freeze,'grading':grading,
              'live':{k:v for k,v in live.items() if k!='rows'}
          })
          PY

      - name: Build portable v5.8.9 runtime data cache
        run: |
          rm -rf /tmp/cs2_cache_publish
          python github_cache_sync_v582.py package --data-dir /tmp/cs2_engine --output-dir /tmp/cs2_cache_publish
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cs2_cache_publish')
          m=json.loads((root/'cs2_data_manifest.json').read_text())
          names={x.get('name') for x in (m.get('files') or [])}
          required={'cs2_provider_cache.json','player_database.json','team_database.json','match_database.json','map_database.json','roster_database.json','veto_database.json','cs2_line_history.json','cs2_core_v42.sqlite3','cs2_data_readiness.json','cs2_grading_health.json','cs2_operational_status.json','cs2_context_health.json','cs2_live_line_catalog.json'}
          missing=required-names
          if missing: raise SystemExit(f'refusing incomplete cache: {sorted(missing)}')
          if m.get('repo_cache_version')!='5.8.2': raise SystemExit(f'wrong cache-format version: {m.get("repo_cache_version")}')
          print('cache validation:',{'runtime':'5.8.9','files':len(names),'archive_size':m.get('archive_size')})
          PY

      - name: Publish single-snapshot data-cache branch
        shell: bash
        run: |
          git config user.name "onewaypickz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/cs2-data-cache-worktree
          git worktree add --detach /tmp/cs2-data-cache-worktree HEAD
          cd /tmp/cs2-data-cache-worktree
          git checkout --orphan data-cache-publish
          git rm -rf . || true
          cp -a /tmp/cs2_cache_publish/. .
          git add -A
          git commit -m "Refresh CS2 v5.8.9 live data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:data-cache --force