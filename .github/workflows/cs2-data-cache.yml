name: CS2 Data Cache

on:
  push:
    branches: [main]
    paths:
      - "collector.py"
      - "collector_v55.py"
      - "github_cache_sync.py"
      - "github_cache_sync_v55.py"
      - "github_cache_sync_v582.py"
      - "autofeed_*.py"
      - "prepare_web_app.py"
      - "start.sh"
      - "railway.collector.toml"
      - ".github/workflows/cs2-data-cache.yml"
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cs2-data-cache
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout main code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile production runtime
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
        run: |
          mkdir -p /tmp/cs2_engine
          RUNTIME="$(python prepare_web_app.py | tail -n 1)"
          python -m py_compile "$RUNTIME" collector_v55.py github_cache_sync_v582.py autofeed_production_v56.py autofeed_identity_v562.py autofeed_context_v57.py autofeed_liveboard_v58.py autofeed_webfast_v581.py autofeed_liveboard_v582.py autofeed_liveboard_v583.py autofeed_liveboard_v584.py autofeed_premodel_v585.py autofeed_verified_v586.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/cs2_engine/.web_runtime_status.json')
          if not p.exists(): raise SystemExit('web runtime status missing')
          s=json.loads(p.read_text())
          if not s.get('ok') or s.get('runtime_version')!='5.8.6': raise SystemExit(f'v5.8.6 runtime not ready: {s}')
          patches={x.get('file'):x for x in s.get('patches') or []}
          required=[
              'autofeed_context_v57.py','autofeed_liveboard_v58.py','autofeed_webfast_v581.py',
              'autofeed_liveboard_v582.py','autofeed_liveboard_v583.py','autofeed_liveboard_v584.py',
              'autofeed_premodel_v585.py','autofeed_verified_v586.py'
          ]
          for name in required:
              if not patches.get(name,{}).get('ok'):
                  raise SystemExit(f'required runtime patch missing {name}: {s}')
          if s.get('verified_source_layer')!='5.8.6': raise SystemExit(f'verified source layer missing: {s}')
          print('runtime validation:',s)
          PY

      - name: Restore prior verified cache
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
        run: |
          python github_cache_sync_v582.py pull --data-dir /tmp/cs2_engine --repo "${GITHUB_REPOSITORY}" --branch data-cache || true
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cs2_engine')
          def load(name, default):
              try: return json.loads((root/name).read_text())
              except Exception: return default
          provider=load('cs2_provider_cache.json',{})
          before={
              'profiles':len(provider.get('profiles') or {}) if isinstance(provider,dict) else 0,
              'teams':len(provider.get('teams') or {}) if isinstance(provider,dict) else 0,
              'matches':len(provider.get('matches') or []) if isinstance(provider,dict) else 0,
              'graded':len(load('cs2_graded_results.json',[])),
              'line_history':len(load('cs2_line_history.json',[])),
          }
          (root/'.v586_before.json').write_text(json.dumps(before))
          print('prior cache:',before)
          PY

      - name: Collect complete current CS2 lines and verified data
        env:
          CS2_DATA_DIR: /tmp/cs2_engine
          CS2_BRIDGE_REPO: ${{ github.repository }}
          CS2_BRIDGE_BRANCH: data-cache
          CS2_ASSISTED_OFFICIAL: "false"
          CS2_AUTO_HARVEST_HISTORY: "true"
          CS2_COLLECT_PROJECTIONS: "true"
          CS2_AUTO_GRADE: "true"
          CS2_DEEP_DATA: "true"
          CS2_WEB_ALLOW_PROVIDER_NETWORK: "true"
          CS2_BO3_PROFILES_PER_REFRESH: "180"
          CS2_AUTOFEED_DIRECT_PROFILE_BATCH: "120"
          CS2_AUTOFEED_DIRECT_WORKERS: "4"
          CS2_HLTV_BATCH_PAGES: "12"
          CS2_HLTV_BATCH_WORKERS: "4"
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: |
          set +e
          python collector_v55.py
          COLLECT_RC=$?
          set -e
          export COLLECT_RC
          echo "collector exit code: ${COLLECT_RC}"
          if [[ -f /tmp/cs2_engine/.autofeed_collector_status.json ]]; then
            cat /tmp/cs2_engine/.autofeed_collector_status.json
          else
            echo "collector status file missing"
          fi
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('/tmp/cs2_engine')
          def load(name, default):
              try: return json.loads((root/name).read_text())
              except Exception: return default
          status_path=root/'.autofeed_collector_status.json'
          if not status_path.exists(): raise SystemExit(f'collector status file missing; rc={os.getenv("COLLECT_RC")}')
          s=json.loads(status_path.read_text())
          if not s.get('ok'): raise SystemExit(f"collector failed: {s.get('error') or s}")
          if int(s.get('underdog_rows') or 0)<=0: raise SystemExit('collector returned no real Underdog CS2 model rows')

          before=json.loads((root/'.v586_before.json').read_text())
          provider=load('cs2_provider_cache.json',{})
          source_status=provider.get('source_status') or {} if isinstance(provider,dict) else {}
          after={
              'profiles':len(provider.get('profiles') or {}) if isinstance(provider,dict) else 0,
              'teams':len(provider.get('teams') or {}) if isinstance(provider,dict) else 0,
              'matches':len(provider.get('matches') or []) if isinstance(provider,dict) else 0,
              'verified_team_profiles':int(source_status.get('verified_team_profiles') or 0),
              'exact_id_rows':int(source_status.get('exact_id_rows') or 0),
              'five_player_lineup_rows':int(source_status.get('five_player_lineup_rows') or 0),
              'premodel_context_rows':int(source_status.get('premodel_context_rows') or 0),
              'projection_ready_rows':int(source_status.get('projection_ready_rows') or 0),
              'graded':len(load('cs2_graded_results.json',[])),
              'line_history':len(load('cs2_line_history.json',[])),
          }
          for key in ['profiles','graded','line_history']:
              if after[key] < before[key]: raise SystemExit(f'regression blocked: {key} {before[key]} -> {after[key]}')
          if after['profiles']>0 and after['teams']<=0:
              raise SystemExit(f'identity persistence failed: {after["profiles"]} profiles but zero teams')

          context=load('cs2_context_health.json',{})
          if not isinstance(context,dict) or context.get('version')!='5.8.6' or context.get('runtime_layer')!='5.8.6':
              raise SystemExit(f'v5.8.6 context report missing: {context}')
          if int(context.get('board_rows') or 0)<=0:
              raise SystemExit(f'v5.8.6 context has no board rows: {context}')
          if int(context.get('non_cs2_rows_visible') or 0)!=0:
              raise SystemExit(f'non-CS2 rows leaked into v5.8.6 board: {context}')

          readiness=load('cs2_data_readiness.json',{})
          if not isinstance(readiness,dict) or readiness.get('version')!='5.8.6' or int(readiness.get('board_rows') or 0)<=0:
              raise SystemExit(f'v5.8.6 readiness report missing: {readiness}')

          live=load('cs2_live_line_catalog.json',{})
          if not isinstance(live,dict) or live.get('version')!='5.8.6':
              raise SystemExit(f'v5.8.6 live-line catalog missing/wrong: {live}')
          if int(live.get('all_cs2_lines') or 0)<=0:
              raise SystemExit(f'live-line catalog empty: {live}')
          if int(live.get('model_supported_lines') or 0)<=0:
              raise SystemExit(f'found no CS2 Maps 1-2 kill lines: {live}')
          if live.get('source_gate')!='explicit Counter-Strike metadata':
              raise SystemExit(f'strict CS2 source gate missing: {live}')

          allowed={'CS','CS2','CSGO','COUNTER_STRIKE','COUNTERSTRIKE'}
          other=('league of legends','dota','valorant','overwatch','rainbow six','rocket league','call of duty')
          bad=[]
          for r in live.get('rows') or []:
              sid=str(r.get('sport_id') or '').strip().upper().replace('-','_').replace(' ','_')
              ev=' | '.join(str(r.get(k) or '') for k in ('sport','sport_name','league','league_name','evidence')).lower()
              explicit=(sid in allowed) or any(x in ev for x in ('counter-strike','counter strike','counterstrike','cs2','cs:go','csgo'))
              foreign=any(x in ev for x in other)
              if foreign or not explicit:
                  bad.append({'player':r.get('player'),'sport_id':r.get('sport_id'),'market':r.get('market')})
          if bad:
              raise SystemExit(f'non-CS2 esports leaked into catalog: {bad[:12]}')

          source_exact=int(live.get('source_exact_match_rows') or 0)
          if source_exact>0 and int(context.get('premodel_context_rows') or 0)<=0:
              raise SystemExit(f'primary-source identity did not reach premodel context: live={source_exact} context={context}')
          if after['profiles']>0 and source_exact>0 and int(readiness.get('projection_ready_rows') or 0)<=0:
              raise SystemExit(f'verified profiles + exact source identities exist but zero rows reached projection-ready: {readiness}')

          board_status=s.get('board_status') or {}
          v586=board_status.get('v586_verified_pipeline') or {}
          if not v586:
              raise SystemExit(f'v5.8.6 board validation missing: {board_status}')
          print('collector validation:', {
              'before':before,'after':after,'context':context,'readiness':readiness,
              'v586':v586,'live_line_catalog':{k:v for k,v in live.items() if k!='rows'}
          })
          PY

      - name: Build portable v5.8.6 runtime data cache
        run: |
          rm -rf /tmp/cs2_cache_publish
          python github_cache_sync_v582.py package --data-dir /tmp/cs2_engine --output-dir /tmp/cs2_cache_publish
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/cs2_cache_publish')
          m=json.loads((root/'cs2_data_manifest.json').read_text())
          files=m.get('files') or []
          names={x.get('name') for x in files}
          required={'cs2_provider_cache.json','player_database.json','team_database.json','match_database.json','map_database.json','roster_database.json','veto_database.json','cs2_line_history.json','cs2_core_v42.sqlite3','cs2_data_readiness.json','cs2_grading_health.json','cs2_operational_status.json','cs2_context_health.json','cs2_live_line_catalog.json'}
          missing=required-names
          if missing: raise SystemExit(f'refusing cache missing required data: {sorted(missing)}')
          if m.get('repo_cache_version')!='5.8.2': raise SystemExit(f'wrong cache-format version: {m.get("repo_cache_version")}')
          for standalone in ['cs2_provider_cache.json','cs2_data_readiness.json','cs2_grading_health.json','cs2_operational_status.json','cs2_context_health.json','cs2_live_line_catalog.json']:
              if not (root/standalone).exists(): raise SystemExit(f'missing standalone status file: {standalone}')
          print('cache validation:', {'runtime':'5.8.6','cache_format':m.get('repo_cache_version'),'files':len(files),'archive_size':m.get('archive_size'),'required_ok':True})
          PY
          ls -lh /tmp/cs2_cache_publish

      - name: Publish single-snapshot data-cache branch
        shell: bash
        run: |
          git config user.name "onewaypickz-data-bot"
          git config user.email "actions@users.noreply.github.com"
          rm -rf /tmp/cs2-data-cache-worktree
          git worktree add --detach /tmp/cs2-data-cache-worktree HEAD
          cd /tmp/cs2-data-cache-worktree
          git checkout --orphan data-cache-publish
          git rm -rf . || true
          cp -a /tmp/cs2_cache_publish/. .
          git add -A
          git commit -m "Refresh CS2 v5.8.6 live data $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push origin HEAD:data-cache --force
